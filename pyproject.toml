[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hfss-net-reproduction"
version = "0.2.0"
description = "RGB-T Object Detection with SDGW, EFC and DCT-HFP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.5.0", "torchvision==0.20.0", "numpy==2.1.2",
  "opencv-python-headless==4.10.0.84", "Pillow==12.2.0", "PyYAML==6.0.2",
  "scipy==1.14.1", "matplotlib==3.9.2", "pandas==2.2.3", "seaborn==0.13.2",
  "tqdm==4.66.5", "psutil==6.1.0", "py-cpuinfo==9.0.0", "requests>=2.31,<3",
  "einops==0.8.0", "ultralytics-thop==2.0.9"
]

[tool.setuptools.packages.find]
include = ["rgbt*", "ultralytics*"]

[tool.setuptools.package-data]
ultralytics = ["cfg/default.yaml"]
